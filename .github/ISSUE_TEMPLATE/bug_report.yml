name: Bug report
description: Report a reproducible problem. Do not report security vulnerabilities here.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use the private reporting process described in SECURITY.md. Never include secrets, personal data, wallet data or production addresses."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: checked
    attributes:
      label: Security check
      options:
        - I confirm this report contains no confidential or production data.
    validations:
      required: true
