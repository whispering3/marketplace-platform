upstream olympus_blue {
    server 127.0.0.1:3000;
}

upstream olympus_green {
    server 127.0.0.1:3001;
}

# Onion clients share the local Tor ingress address, so use a generous global
# ceiling to absorb floods without turning normal traffic into an identity key.
limit_req_zone $server_name zone=olympus_global_rate:10m rate=40r/s;
limit_conn_zone $server_name zone=olympus_global_connections:10m;

server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 1m;
    limit_req zone=olympus_global_rate burst=80 nodelay;
    limit_conn olympus_global_connections 200;
    # Promote only by editing this server-owned setting and reloading after nginx -t.
    set $olympus_upstream olympus_blue;

    location / {
        proxy_pass http://$olympus_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Deployment-Color "";
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header X-Powered-By;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
